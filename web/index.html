<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!--
      Browser chrome for a reader following the system. An explicit light or dark choice adds a
      media-less meta ahead of these, because the browser uses the first one whose media matches;
      see applyTheme in web/src/services/session/theme.ts.
    -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f4f5f7"
      data-scheme="light"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#08090a"
      data-scheme="dark"
    />
    <!--
      Applies the stored theme before the first paint. It has to be inline and here: a module runs
      after the document is painted, so a reader who chose dark would see a white flash first.
    -->
    <script>
      try {
        var t = localStorage.getItem('jbv:theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        /* Site data blocked; the theme falls back to the system preference. */
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>JVM Bytecode Visualizer: step through Java bytecode</title>
    <meta
      name="description"
      content="Parse, disassemble and execute a .class file in the browser, then replay the run instruction by instruction: call stack, operand stack and every local variable slot."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="JVM Bytecode Visualizer" />
    <meta
      property="og:description"
      content="Watch a Java program run one bytecode instruction at a time: call stack, operand stack and locals, with the whole run replayable."
    />
    <!--
      Root-relative so it resolves under any host. Facebook, X and Slack all require an absolute
      URL, so a deploy has to replace this with https://<domain>/og-image.jpg for link previews
      to resolve.
    -->
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="750" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      This page parses and runs Java bytecode in your browser, so it needs JavaScript enabled.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
