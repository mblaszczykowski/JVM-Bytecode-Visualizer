# Fly.io configuration for the compile service.
#
# Deploy from this directory: `fly deploy` uses server/ as the build context, which is what the
# Dockerfile expects (it copies pom.xml and src/).
#
# Before the first deploy, replace the two placeholders below:
#   app                             the name reserved with `fly apps create` / `fly launch --no-deploy`
#   COMPILE_SERVICE_ALLOWED_ORIGIN  the exact origin the frontend is served from
#
# See docs/deployment.md for the full walk-through.

app = "CHANGE-ME-compile-service"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  # The Dockerfile already runs on a JDK image, which the service requires: without the
  # jdk.compiler module ToolProvider.getSystemJavaCompiler() returns null.
  PORT = "8080"

  # No trailing slash and no "*"; the application refuses to start with a wildcard origin.
  COMPILE_SERVICE_ALLOWED_ORIGIN = "https://CHANGE-ME.vercel.app"

  # Fly's proxy appends the client address to X-Forwarded-For, and it is the last entry.
  # Without this the rate limiter would bucket every request under the proxy's own address.
  COMPILE_SERVICE_TRUST_FORWARDED_FOR = "true"
  COMPILE_SERVICE_TRUSTED_PROXY_HOPS = "1"

  # Each concurrent compilation is a child JVM budgeted at ~270 MB: 240 MB of bounded regions
  # (128 heap, 64 metaspace, 32 code cache, 16 direct) plus roughly 25 MB no flag bounds.
  # Keep this in step with the memory below.
  COMPILE_SERVICE_MAX_CONCURRENT_COMPILATIONS = "2"

[http_service]
  internal_port = 8080
  force_https = true
  # A stopped machine costs nothing, but the first request after a stop pays a cold start. The
  # frontend gives the health check 2 s before hiding the editor, so set min_machines_running to 1
  # if the editor has to be there on the first visit.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/actuator/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  # Sized from the ceilings rather than from a measurement, so the arithmetic has to close on the
  # bounds. -XX:MaxRAMPercentage=25 in the Dockerfile caps the parent's heap at 256 MB of this,
  # and each of the two children is budgeted at ~270 MB (see the comment on that variable above):
  #
  #   256 + 2 x 270 = 796 MB against 1024
  #
  # The 228 MB left over is what the parent's own non-heap regions come out of; no flag bounds
  # those, and the parent runs at roughly 375 MB of RSS in total, which puts the full worst case
  # near 915 MB. A real compile commits about 184 MB per child rather than 270, so the ordinary
  # figure is closer to 743 MB.
  #
  # If that stops fitting, the first lever is COMPILE_SERVICE_MAX_CONCURRENT_COMPILATIONS = "1"
  # (256 + 270 = 526 MB on the bounds), and the second is a larger machine. Raising the memory
  # alone also raises the parent's heap, since its share is a percentage.
  #
  # docs/deployment.md carries the measured numbers behind this.
  memory = "1gb"
