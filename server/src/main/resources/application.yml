spring:
  application:
    name: compile-service

server:
  port: ${PORT:8080}
  shutdown: graceful

compile:
  allowed-origin: ${COMPILE_SERVICE_ALLOWED_ORIGIN:http://localhost:5173}
  max-source-size: 64KB
  # Room for a 64 KiB source even when JSON escaping inflates it; past this nothing is buffered.
  max-request-size: 256KB
  # Wall clock for the whole child process: spawning the JVM, javac, and reading the result back.
  timeout: 10s
  # Each compilation costs a JVM, so the number of them is the resource that has to be bounded.
  max-concurrent-compilations: ${COMPILE_SERVICE_MAX_CONCURRENT_COMPILATIONS:2}
  rate-limit:
    requests-per-minute: 10
    trust-forwarded-for: ${COMPILE_SERVICE_TRUST_FORWARDED_FOR:false}
    # How many proxies append to X-Forwarded-For between the client and this service.
    trusted-proxy-hops: ${COMPILE_SERVICE_TRUSTED_PROXY_HOPS:1}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
