spring:
  application:
    name: compile-service

server:
  port: ${PORT:8080}
  shutdown: graceful

compile:
  allowed-origin: ${COMPILE_SERVICE_ALLOWED_ORIGIN:http://localhost:5173}
  max-source-size: 64KB
  # Room for a 64 KiB source after JSON escaping. Nothing beyond this is buffered.
  max-request-size: 256KB
  # Wall clock for the whole child process: JVM start-up, javac, and reading the result back.
  timeout: 10s
  # Each compilation costs a child JVM, so this is the resource that has to be bounded.
  max-concurrent-compilations: ${COMPILE_SERVICE_MAX_CONCURRENT_COMPILATIONS:2}
  rate-limit:
    requests-per-minute: 10
    trust-forwarded-for: ${COMPILE_SERVICE_TRUST_FORWARDED_FOR:false}
    # How many proxies append to X-Forwarded-For between the client and this service.
    trusted-proxy-hops: ${COMPILE_SERVICE_TRUSTED_PROXY_HOPS:1}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # This service never touches the filesystem, so a full rootfs is not a reason to report DOWN
    # and have the frontend hide the editor.
    diskspace:
      enabled: false

logging:
  level:
    root: INFO
