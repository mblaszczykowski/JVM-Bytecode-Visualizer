name: web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web.yml'

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage -w web

      - name: Build
        run: npm run build

      - name: Check the bundle budget
        run: npm run size -w web

  corpus:
    name: parses the real world
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore the corpus
        uses: actions/cache@v4
        with:
          path: web/corpus/.cache
          key: corpus-${{ hashFiles('web/corpus/fetch-corpus.mjs') }}

      - name: Install dependencies
        run: npm ci

      - name: Fetch the corpus
        run: npm run corpus -w web

      - name: Scan it
        run: npm run test:corpus -w web

  fixtures:
    name: fixtures match the JDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 25, not the 21 the class files target: javap changed its disassembly layout in 25 and
      # the committed dumps are byte-exact. Both builders refuse any other release; the version
      # lives in web/fixtures/jdk.mjs as REQUIRED_JDK_FEATURE.
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild the examples
        run: npm run fixtures -w web

      - name: Rebuild the test fixtures
        run: npm run fixtures:tests -w web

      # git add first, so the diff sees newly produced files too.
      - name: Fail on any drift
        run: |
          git add --all \
            web/public/examples \
            web/src/core/classfile/__fixtures__ \
            web/src/core/disassembler/__fixtures__ \
            web/src/core/interpreter/__fixtures__/programs
          git diff --cached --exit-code \
            web/public/examples \
            web/src/core/classfile/__fixtures__ \
            web/src/core/disassembler/__fixtures__ \
            web/src/core/interpreter/__fixtures__/programs
