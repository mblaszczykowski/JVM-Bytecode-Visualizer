name: web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      # The deployment config builds and serves web/, so a change to it belongs to this gate.
      - 'vercel.json'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - '.github/workflows/web.yml'

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # eslint stops an import reaching past a module barrel; nothing else notices two modules
      # importing each other, which is legal until the day one reads the other during evaluation.
      - name: Check the module graph for cycles
        run: npm run imports -w web

      # vercel.json allows the inline theme script in web/index.html by sha256, and neither file
      # can tell that the other moved. That is why vercel.json is in this workflow's path filter.
      - name: Check the CSP hash against the inline script
        run: npm run csp -w web

      - name: Test
        run: npm run test:coverage -w web

      - name: Build
        run: npm run build

      - name: Check the bundle budget
        run: npm run size -w web

  corpus:
    name: parses the real world
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore the corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: web/corpus/.cache
          key: corpus-${{ hashFiles('web/corpus/fetch-corpus.mjs') }}

      - name: Install dependencies
        run: npm ci

      - name: Fetch the corpus
        run: npm run corpus -w web

      # CORPUS_REQUIRED turns the "the corpus is unpacked" assertion from a skip into a failure.
      # Only this job fetches the corpus, so only this job may demand it.
      - name: Scan it
        run: npm run test:corpus -w web
        env:
          CORPUS_REQUIRED: '1'

  fixtures:
    name: fixtures match the JDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      # 25, not the 21 the class files target: javap changed its disassembly layout in 25 and
      # the committed dumps are byte-exact. Down to the patch number, because the artifacts this
      # job diffs are byte-exact too. Both builders refuse any other version; it lives in
      # web/fixtures/jdk.mjs as REQUIRED_JDK_VERSION and the two have to be raised together.
      - name: Setup JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '25.0.4'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild the examples
        run: npm run fixtures -w web

      - name: Rebuild the test fixtures
        run: npm run fixtures:tests -w web

      # git add first, so the diff sees newly produced files too.
      - name: Fail on any drift
        run: |
          git add --all \
            web/public/examples \
            web/src/core/classfile/__fixtures__ \
            web/src/core/disassembler/__fixtures__ \
            web/src/core/interpreter/__fixtures__/programs \
            web/src/services/__fixtures__ \
            web/tests/e2e/fixtures
          git diff --cached --exit-code \
            web/public/examples \
            web/src/core/classfile/__fixtures__ \
            web/src/core/disassembler/__fixtures__ \
            web/src/core/interpreter/__fixtures__/programs \
            web/src/services/__fixtures__ \
            web/tests/e2e/fixtures
