name: e2e

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'server/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'server/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  playwright:
    name: playwright / chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore the browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run e2e -w web

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  compile-service:
    name: playwright / against the compile service
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: playwright
    env:
      COMPILE_API_URL: http://localhost:8080
      PREVIEW_ORIGIN: http://localhost:4173
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build the compile service image
        run: docker build -t compile-service:ci server

      - name: Start the compile service
        run: |
          docker run -d --name compile-service -p 8080:8080 \
            -e COMPILE_SERVICE_ALLOWED_ORIGIN="$PREVIEW_ORIGIN" \
            compile-service:ci

      - name: Wait for it to answer
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS "$COMPILE_API_URL/actuator/health" | grep -q '"status":"UP"'; then
              echo "compile service is up"
              exit 0
            fi
            sleep 2
          done
          echo "the compile service never became healthy"
          docker logs compile-service
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Restore the browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # COMPILE_SERVICE_REQUIRED turns "no PLAYWRIGHT_COMPILE_API_URL" from a silent skip of the
      # whole spec into a failure. This is the only job that starts the service, so it is the only
      # one that may demand it.
      - name: Run the compile end-to-end tests
        run: npm run e2e -w web -- tests/e2e/compile.spec.ts
        env:
          VITE_COMPILE_API_URL: ${{ env.COMPILE_API_URL }}
          PLAYWRIGHT_COMPILE_API_URL: ${{ env.COMPILE_API_URL }}
          COMPILE_SERVICE_REQUIRED: '1'

      - name: Compile service logs
        if: failure()
        run: docker logs compile-service

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-compile-service
          path: web/playwright-report/
          retention-days: 7
