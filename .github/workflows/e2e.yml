name: e2e

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'server/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'server/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  playwright:
    name: playwright / chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run e2e -w web

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  compile-service:
    name: playwright / against the compile service
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: playwright
    env:
      COMPILE_API_URL: http://localhost:8080
      PREVIEW_ORIGIN: http://localhost:4173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build the compile service image
        run: docker build -t compile-service:ci server

      - name: Start the compile service
        run: |
          docker run -d --name compile-service -p 8080:8080 \
            -e COMPILE_SERVICE_ALLOWED_ORIGIN="$PREVIEW_ORIGIN" \
            compile-service:ci

      - name: Wait for it to answer
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS "$COMPILE_API_URL/actuator/health" | grep -q '"status":"UP"'; then
              echo "compile service is up"
              exit 0
            fi
            sleep 2
          done
          echo "the compile service never became healthy"
          docker logs compile-service
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Restore the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the compile end-to-end tests
        run: npm run e2e -w web -- tests/e2e/compile.spec.ts
        env:
          VITE_COMPILE_API_URL: ${{ env.COMPILE_API_URL }}
          PLAYWRIGHT_COMPILE_API_URL: ${{ env.COMPILE_API_URL }}

      - name: Compile service logs
        if: failure()
        run: docker logs compile-service

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-compile-service
          path: web/playwright-report/
          retention-days: 7
